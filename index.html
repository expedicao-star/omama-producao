<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMAMA Produção</title>
<meta name="theme-color" content="#9f76ff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<style>
:root{--bg:#f8f6ff;--card:#ffffff;--card2:#efeaff;--line:#e2daf7;--txt:#241d33;--mut:#766f8a;--amb:#7c55e0;--lil:#9f76ff;--ok:#2f9e5b;--bad:#d2453b;--mid:#d49a1f;--blue:#6fa8dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 "Rethink Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--lil);color:#fff;z-index:16}
header .logo{height:22px;width:auto;display:block}
header .sub{font-size:13px;letter-spacing:.25em;font-weight:600;color:#fff;opacity:.85;border-left:1px solid #ffffff80;padding-left:12px}
header h1{font-size:17px;margin:0;letter-spacing:.08em}
header h1 span{color:#e6d4f2;font-weight:500}
header .mut{color:#fff;opacity:.85}
header .sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:14px}
#hamb{background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:0 4px;cursor:pointer;display:none}
body.logado #hamb{display:block}
#pg{font-weight:700;font-size:15px}
#side{display:none;position:fixed;top:0;left:0;bottom:0;width:240px;background:#fff;border-right:1px solid var(--line);overflow:auto;z-index:15;padding:58px 8px 20px;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 16px #7c55e01a}
body.logado #side{display:block}body.menu #side{transform:none}
#sideBg{display:none;position:fixed;inset:0;background:#2b1f3340;z-index:14}body.menu #sideBg{display:block}
.gh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:10px 10px;font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);cursor:pointer;border-radius:8px}
.gh:hover{background:var(--card2)}.gh i{font-style:normal;transition:transform .15s}.gh.fechado i{transform:rotate(-90deg)}
.gi{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px 9px 18px;font:inherit;font-size:15px;font-weight:600;color:var(--txt);cursor:pointer;border-radius:8px}
.gi b{display:inline-block;width:24px;color:var(--lil)}.gi:hover{background:var(--card2)}.gi.on{background:var(--amb);color:#fff}.gi.on b{color:#fff}
@media(min-width:1000px){body.logado #side{transform:none;box-shadow:none}body.logado main{margin-left:240px}#sideBg{display:none!important}body.logado #hamb{display:none}}
.t-blue{background:#e1eefb;color:#2d6aa3}
input[type=checkbox]{accent-color:var(--amb)}
@media(max-width:600px){header .sub{display:none}}
@media print{#side,#sideBg,header,.noprint,.toast{display:none!important}body.logado main{margin:0;max-width:none}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
body.tv #side,body.tv #sideBg{display:none!important}body.tv main{margin-left:0!important;max-width:none}body.tv{font-size:18px}
.st{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.st.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}.st.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}.st.on.midc{background:var(--mid);border-color:var(--mid);color:#fff}.st.on.blue{background:var(--blue);border-color:var(--blue);color:#fff}.st.on.mut{background:var(--mut);border-color:var(--mut);color:#fff}
.pess{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.pess:last-child{border:0}.pess .nm{flex:1;min-width:140px;font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:18px 0 8px}
h2:first-child{margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{background:var(--card);border:2px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 10px;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.chip small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.chip.on{border-color:var(--amb);background:var(--amb);color:#fff}
.chip.on small{color:#e9e1ff}
input,select,textarea{background:var(--card);border:2px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
.btn{background:var(--amb);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt)}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.mid{background:var(--mid);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 3px #7c55e00f}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.t-pendente{background:#f0edf7;color:var(--mut)}.t-produzindo{background:#dcf3e4;color:#1f7a44}.t-pausado{background:#fbefd3;color:#94690d}.t-finalizado{background:#ece4ff;color:#5b3cc4}
.ok{color:var(--ok)}.bad{color:var(--bad)}.midc{color:var(--mid)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{min-width:250px;max-width:250px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px}
.col.vz{min-width:150px;max-width:150px;opacity:.6}
.col h3{font-size:12px;margin:2px 4px 8px;color:var(--amb);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.op{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px #7c55e00f;border-radius:10px;padding:9px;margin-bottom:7px;cursor:pointer}
.op b{display:block;font-size:14px}.op .mut{font-size:12px}
.late{border-left:4px solid var(--bad)}
.fila .card{margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila .info{flex:1;min-width:200px}
.fila .info b{font-size:16px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;display:none;z-index:30}
.toast.err{background:var(--bad);color:#fff}
.vazio{color:var(--mut);padding:20px;text-align:center}
.modal{position:fixed;inset:0;background:#2b1f3366;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px}
.modal>div{background:var(--bg);box-shadow:0 10px 40px #2b1f3340;border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:900px}
.login{max-width:340px;margin:12vh auto;text-align:center}
.login input{width:100%;margin:14px 0;text-align:center;font-size:22px;letter-spacing:.2em}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amb)}
.link{color:var(--amb);cursor:pointer;text-decoration:underline}
.ped{display:inline-block;background:#efeaff;color:#5b3cc4;border:1px solid #d9ccff;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;cursor:pointer}
.ped.est{background:#f0edf7;color:var(--mut);border-color:var(--line);cursor:default}
.pd{cursor:pointer;margin-bottom:8px}.pd b{font-size:16px}
</style>
</head>
<body>
<header><button id="hamb" aria-label="Menu">☰</button><svg class="logo" viewBox="0 0 1401 298" fill="currentColor" aria-label="OMAMA"><path d="M185.928 217.413C172.656 233.476 154.074 241.475 135.988 241.475C117.902 241.475 99.2459 233.476 85.8371 217.413C72.4284 201.351 65.724 178.546 65.724 148.926C65.724 119.306 72.4284 96.5013 85.8371 80.4389C99.2459 64.3765 117.891 56.3769 135.988 56.3769C154.084 56.3769 172.656 64.4399 185.854 80.5762C199.051 96.6386 205.692 119.443 205.692 148.926C205.692 178.409 199.125 201.351 186.002 217.413H185.928ZM227.695 32.8857C205.692 10.9901 177.608 0 135.988 0C94.368 0 66.2836 10.9901 44.2805 32.8857C14.7391 58.6806 0 97.4101 0 149C0 200.59 14.7391 238.273 44.2805 265.114C66.2836 287.02 94.3575 298 135.988 298C177.618 298 205.692 287.084 227.695 265.114C257.026 238.273 271.342 199.544 271.342 149C271.342 98.4562 257.026 58.7546 227.695 32.8857Z"/><path id="lm" d="M496.186 12.5646L448.379 188.712C447.893 190.519 445.243 190.519 444.758 188.712L396.951 12.5646C396.328 10.1975 394.09 8.52783 391.587 8.52783H293.809C290.747 8.52783 288.234 10.9689 288.234 13.9595V285.171C288.234 288.162 290.747 290.603 293.809 290.603H346.705C349.767 290.603 352.28 288.162 352.28 285.171V72.8092C352.28 71.837 353.114 71.0022 354.159 71.0022H357.369C358.203 71.0022 358.973 71.5622 359.185 72.397L415.216 286.503C415.839 288.87 418.078 290.613 420.58 290.613H472.642C475.218 290.613 477.382 288.944 478.005 286.503L534.037 72.397C534.248 71.6256 535.008 71.0022 535.853 71.0022H539.062C540.108 71.0022 540.942 71.837 540.942 72.8092V285.171C540.942 288.162 543.455 290.603 546.516 290.603H599.412C602.474 290.603 604.987 288.162 604.987 285.171V13.8855C604.987 10.8949 602.474 8.45386 599.412 8.45386H501.634C499.121 8.45386 496.894 10.1235 496.271 12.4906L496.197 12.5646H496.186Z"/><path id="la" d="M754.132 183.989H703.021C701.838 183.989 700.993 183.017 701.205 181.896L718.446 72.4924C718.583 71.5836 719.354 70.9602 720.262 70.9602H736.806C737.714 70.9602 738.548 71.5836 738.622 72.4924L755.864 181.896C756.001 183.017 755.167 183.989 754.048 183.989H754.122H754.132ZM784.149 8.4541H674.535C673.627 8.4541 672.856 9.07758 672.719 9.9124L620.847 288.511C620.636 289.631 621.544 290.603 622.663 290.603H682.432C683.34 290.603 684.111 289.98 684.248 289.071L692.906 234.226C693.043 233.317 693.814 232.694 694.722 232.694H762.304C763.212 232.694 764.046 233.317 764.12 234.226L772.778 289.071C772.915 289.98 773.686 290.603 774.594 290.603H834.363C835.545 290.603 836.39 289.557 836.179 288.511L784.149 8.4541Z"/><use href="#lm" x="563.8"/><use href="#la" x="563.8"/></svg><span class="sub">PRODUÇÃO</span><span id="pg"></span><div class="sp"></div><span class="mut" id="relogio"></span></header>
<main id="app"></main>
<aside id="side"></aside><div id="sideBg"></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>
const API_PADRAO = 'https://omama-producao.expedicao-4e9.workers.dev';
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const API = () => ls.get('api') || API_PADRAO;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n,d=1) => Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const hojeISO = () => new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const brData = s => s ? new Date(s.slice(0,10)+'T12:00').toLocaleDateString('pt-BR') : '';
const brHora = s => s ? new Date(s.replace(' ','T')+'Z').toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const dur = m => { m=Math.round(m||0); if(m<60) return m+' min'; const h=Math.floor(m/60); if(h<48) return h+'h'+String(m%60).padStart(2,'0'); return fmt(m/1440,1)+' dias'; };
const decorrido = o => (o.minutos||0) + (o.status==='produzindo'&&o.inicio_atual ? Math.max(0,(Date.now()-Date.parse(o.inicio_atual.replace(' ','T')+'Z'))/6e4) : 0);
let B = null; const S = { tab:'fila', setor:3, busca:'', dep:11, per:'semana', dia:null, defHist:false };
try{ const a=localStorage.getItem('aba'); if(['painel','fila','ops','ped','exp','pcp','itens','estoque','ent','inv','defeitos','func','assid','rel','sem','usu','perm'].includes(a)) S.tab=a; }catch(e){}

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2800); }
async function api(path, body){
  const r = await fetch(API()+path, body===undefined?{headers:{'X-Token':ls.get('token')||''}}:{method:'POST',headers:{'Content-Type':'application/json','X-Token':ls.get('token')||''},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));
  if (r.status===401){ ls.del('token'); telaLogin('Entre de novo com seu usuário e senha'); throw new Error('401'); }
  if (!r.ok) throw new Error(j.erro||'Erro');
  return j;
}
const tenta = fn => async (...a) => { try { await fn(...a); } catch(e){ if(e.message!=='401') toast(e.message,1); } };
function modal(html){ $('#modal').innerHTML = html ? `<div class="modal" id="mbg"><div>${html}</div></div>` : ''; if(html) $('#mbg').onclick=e=>{ if(e.target.id==='mbg') modal(''); }; }
function escolher(titulo, opcoes){ // opcoes: [{id,nome,sub}]
  return new Promise(res=>{
    modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(titulo)}</h2><button class="btn sec sm" id="mx">Fechar</button></div><br>
      <div class="grid">${opcoes.map(o=>`<div class="chip" data-id="${o.id}" ${o.id<0?'style="border-style:dashed"':''}>${esc(o.nome)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>`).join('')}</div>`);
    $('#mx').onclick=()=>{modal('');res(null)};
    document.querySelectorAll('#modal [data-id]').forEach(c=>c.onclick=()=>{modal('');res(+c.dataset.id)});
  });
}
const pessoas = setor_id => [...B.funcionarios].sort((a,b)=>(b.setor_id===setor_id)-(a.setor_id===setor_id)||a.nome.localeCompare(b.nome)).map(f=>({id:f.id,nome:f.nome,sub:(B.setores.find(s=>s.id===f.setor_id)||{}).nome}));

// ===== login
let EU=null;
const semAuth=(path,body)=>fetch(API()+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}).then(async r=>{ const j=await r.json().catch(()=>({erro:'Resposta inválida do servidor'})); if(!r.ok) throw new Error(j.erro||'Erro'); return j; });
async function telaLogin(msg){
  document.body.classList.remove('logado','menu'); ls.del('codigo'); B=null; EU=null;
  let primeiro=false; try{ primeiro=!(await semAuth('/api/auth/estado')).tem_usuarios; }catch(e){ msg=msg||'Não consegui falar com o servidor'; }
  app.innerHTML = primeiro?`<div class="login" style="max-width:380px"><h2>Criar o administrador</h2><p class="mut">Primeiro acesso: crie o seu usuário de administrador. Para confirmar que é você, digite também o código antigo do sistema.</p>
      <input id="lc" type="password" inputmode="numeric" placeholder="Código do sistema" autocomplete="off" style="letter-spacing:normal;font-size:16px"><input id="ln" placeholder="Seu nome" style="letter-spacing:normal;font-size:16px">
      <input id="ll" placeholder="Usuário (ex.: emanuel)" autocapitalize="none" autocomplete="username" style="letter-spacing:normal;font-size:16px"><input id="ls1" type="password" placeholder="Senha (mín. 6)" autocomplete="new-password" style="letter-spacing:normal;font-size:16px"><input id="ls2" type="password" placeholder="Repita a senha" autocomplete="new-password" style="letter-spacing:normal;font-size:16px">
      <button class="btn" id="entrar" style="width:100%">Criar e entrar</button><p class="bad" id="lm">${esc(msg||'')}</p></div>`
    :`<div class="login"><h2>Entrar</h2><input id="ll" placeholder="Usuário" autocapitalize="none" autocomplete="username" style="letter-spacing:normal;font-size:18px"><input id="ls1" type="password" placeholder="Senha" autocomplete="current-password" style="letter-spacing:normal;font-size:18px">
      <button class="btn" id="entrar" style="width:100%">Entrar</button><p class="bad" id="lm">${esc(msg||'')}</p></div>`;
  $('#entrar').onclick = async()=>{ try{
      let r; if(primeiro){ if($('#ls1').value!==$('#ls2').value) throw new Error('As duas senhas não são iguais'); r=await semAuth('/api/auth/primeiro',{codigo:$('#lc').value.trim(),nome:$('#ln').value,login:$('#ll').value,senha:$('#ls1').value}); }
      else r=await semAuth('/api/auth/login',{login:$('#ll').value,senha:$('#ls1').value});
      ls.set('token',r.token); await iniciar(); }catch(e){ $('#lm').textContent=e.message; } };
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') $('#entrar').click(); });
  (app.querySelector('input')||{focus(){}}).focus();
}
async function iniciar(){
  if(!ls.get('token')) return telaLogin();
  try{ [B,EU] = await Promise.all([api('/api/base'),api('/api/eu')]); }catch(e){ if(e.message!=='401') telaLogin('Não consegui falar com o servidor ('+e.message+')'); return; }
  if(!pode(S.tab)){ const t=MENU.flatMap(x=>x[1]).map(x=>x[0]).find(pode); S.tab=t||'nada'; }
  document.body.classList.add('logado'); menu(); render();
}
// ===== menu lateral em grupos que abrem e fecham (igual Sensio)
const MENU=[['Produção',[['painel','◉','Painel'],['fila','⚒','Setores'],['ops','▦','OPs'],['ped','✉','Pedidos'],['exp','⇪','Expedição'],['pcp','☷','PCP']]],['Estoque',[['estoque','▤','Estoque'],['ent','⇩','Entrada de madeira'],['inv','☑','Inventário'],['defeitos','⚠','Defeitos'],['itens','◫','Itens']]],['Pessoas',[['func','☺','Funcionários'],['assid','✓','Assiduidade']]],['Relatórios',[['rel','▮▮','Produção'],['efic','↗','Eficiência'],['sem','▤','Semana']]]];
let fechados=[]; try{ fechados=JSON.parse(ls.get('menuFechado')||'[]'); }catch(e){}
const pode=t=>!!EU&&(EU.admin||(['usu','perm'].includes(t)?false:(EU.permissoes||[]).includes(t)));
function menu(){
  $('#side').innerHTML=MENU.map(([g,its])=>[g,its.filter(([t])=>pode(t))]).filter(([g,its])=>its.length).map(([g,its])=>`<button class="gh ${fechados.includes(g)?'fechado':''}" data-g="${g}">${g}<i>▾</i></button>
    <div ${fechados.includes(g)?'style="display:none"':''}>${its.map(([t,ic,n])=>`<button class="gi ${S.tab===t?'on':''}" data-t="${t}"><b>${ic}</b>${n}</button>`).join('')}</div>`).join('')
    +`<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:10px"><div class="mut" style="padding:4px 18px">Entrou como <b>${esc(EU&&EU.nome||'')}</b>${EU&&EU.admin?' · admin':''}</div>${EU&&EU.admin?`<button class="gi ${S.tab==='usu'?'on':''}" data-t="usu"><b>⚿</b>Usuários</button><button class="gi ${S.tab==='perm'?'on':''}" data-t="perm"><b>☑</b>Permissões</button>`:''}<button class="gi" id="senha" style="color:var(--mut)"><b>✱</b>Trocar minha senha</button><button class="gi" id="sair" style="color:var(--mut)"><b>⏻</b>Sair</button></div>`;
  $('#side').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const g=b.dataset.g; fechados=fechados.includes(g)?fechados.filter(x=>x!==g):[...fechados,g]; ls.set('menuFechado',JSON.stringify(fechados)); menu(); });
  $('#side').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; ls.set('aba',S.tab); document.body.classList.remove('menu'); menu(); render(); });
  $('#senha').onclick=()=>{ document.body.classList.remove('menu'); trocarSenha(); };
  $('#sair').onclick=async()=>{ try{ await api('/api/auth/sair',{}); }catch(e){} ls.del('token'); telaLogin(); };
  const at=MENU.flatMap(x=>x[1]).find(x=>x[0]===S.tab); $('#pg').textContent=at?at[2]:S.tab==='usu'?'Usuários':S.tab==='perm'?'Permissões':'';
}
$('#hamb').onclick=()=>document.body.classList.toggle('menu');

// ===== ações de operação (usadas na fila e na OP)
const acao = tenta(async (o, tipo, depois) => {
  let funcionario_id = null;
  const precisa = o.setor_id && !o.funcionario_id && (tipo==='iniciar'||tipo==='finalizar');
  if (tipo==='iniciar' && o.setor_id || precisa) {
    const ops = o.status==='pendente' ? [...pessoas(o.setor_id), {id:-1,nome:'Operador',sub:'Já foi feita: finaliza com o tempo padrão'}] : pessoas(o.setor_id);
    funcionario_id = await escolher(tipo==='iniciar'?'Quem vai fazer?':'Quem fez?', ops);
    if (!funcionario_id) return;
    if (funcionario_id===-1) {
      if (!confirm('Finalizar essa etapa como "Operador"? Ela fica marcada como sem registro e o tempo padrão vira o tempo estimado.')) return;
      await api(`/api/operacoes/${o.id}/finalizar`, {operador:true});
      toast('✓ Finalizada (tempo estimado)'); depois(); return;
    }
  }
  if (tipo==='reabrir' && !confirm('Reabrir essa operação?')) return;
  await api(`/api/operacoes/${o.id}/${tipo}`, {funcionario_id});
  toast({iniciar:'▶ Iniciada',pausar:'⏸ Pausada',finalizar:'✓ Finalizada',reabrir:'Reaberta'}[tipo]);
  depois();
});
const botoes = o => o.status==='finalizado' ? `<button class="btn sec sm" data-a="reabrir">Reabrir</button>`
  : o.status==='produzindo' ? `<button class="btn mid sm" data-a="pausar">⏸ Pausar</button> <button class="btn ok sm" data-a="finalizar">✓ Finalizar</button>`
  : `<button class="btn sm" data-a="iniciar">▶ Iniciar</button> <button class="btn sec sm" data-a="finalizar">✓ Finalizar</button>`;
const tag = s => `<span class="tag t-${s}">${s}</span>`;
const nomeOp = c => +c>=100000 ? 'RT '+(c-100000) : 'OP '+c;
const pedTag = o => o.pedido_numero ? `<span class="ped" data-ped="${esc(o.pedido_numero)}">Pedido ${esc(o.pedido_numero)} · ${esc(o.pedido_cliente||'')}</span>` : `<span class="ped est">Estoque</span>`;
const ligaPed = root => root.querySelectorAll('[data-ped]').forEach(c=>c.onclick=e=>{e.stopPropagation(); abrirPedido(c.dataset.ped);});
const diasAte = s => s ? Math.round((new Date(s.slice(0,10)+'T12:00')-new Date(hojeISO()+'T12:00'))/864e5) : null;

    modal(`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Fotos · Pedido ${esc(p.numero)}</h2><div style="font-weight:800">${esc(x.descricao)}</div><div class="mut">Fotos da peça no pedido. As fotos tiradas nas OPs dessa peça também entram no zip do pedido.</div></div><button class="btn sec sm" id="fv">Voltar</button></div><br><div class="card" id="fts">Carregando…</div>`);

  document.querySelectorAll('#modal [data-op]').forEach(c=>c.onclick=()=>abrirOp(+c.dataset.op));

    <h2>Roteiro de produção <span class="mut">(toque no tempo para mudar · ${dur(tot)} de mão de obra por peça)</span></h2><div class="card"><table><tr><th>#</th><th>Operação</th><th class="n">Tempo por peça</th></tr>
      ${i.roteiro.map(r=>`<tr><td>${r.ordem}</td><td>${esc(r.nome)}${r.espera?' <span class="mut">(espera)</span>':''}</td><td class="n"><span class="link" data-o="${r.ordem}" data-t="${r.tempo_min}">${fmt(r.tempo_min,0)} min</span></td></tr>`).join('')||'<tr><td colspan=3 class="mut">Sem roteiro.</td></tr>'}</table></div>
    <h2>Estoque</h2><div class="card">${i.estoque.map(e=>`<div>${esc(e.nome)}: <b>${fmt(e.saldo,3)}</b></div>`).join('')||'<span class="mut">Sem saldo.</span>'}</div>`);
  $('#mx').onclick=()=>modal('');
  document.querySelectorAll('#modal [data-o]').forEach(s=>s.onclick=tenta(async()=>{ const v=prompt('Tempo por peça em minutos:',s.dataset.t); if(v===null) return; const n=parseFloat(v.replace(',','.')); if(!(n>=0)) return toast('Número inválido',1);
    await api(`/api/itens/${id}/roteiro`,{ordem:+s.dataset.o,tempo_min:n}); toast('Tempo atualizado (vale para OPs novas)'); abrirItem(id); }));
});

  app.innerHTML=`<h2>Novo inventário</h2><div class="row"><select id="vd">${B.depositos.map(d=>`<option value="${d.id}" ${d.id===11?'selected':''}>${esc(d.nome)}</option>`).join('')}</select><input id="vo" placeholder="Observação (opcional)" style="flex:1;min-width:180px"><button class="btn" id="vn">Começar contagem</button></div>

  $('#vl').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>abrirInv(+b.dataset.v));
}
const abrirInv=tenta(async id=>{
  const v=await api('/api/inventarios/'+id), ab=v.status==='aberto';
  let filtro='', so=ab?'todos':'dif';
  const dif=it=>it.contado===null?null:Math.round((it.contado-(ab?it.saldo_atual:it.contado-it.ajuste))*1000)/1000;
  modal(`<div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Inventário nº ${v.id} · ${esc(v.deposito)}</h2><div class="mut">${ab?'Em contagem':'Fechado em '+brHora(v.fechado_em)} · aberto em ${brHora(v.criado_em)}${v.obs?' · '+esc(v.obs):''}</div></div><button class="btn sec sm" id="mx">Fechar</button></div><br>
    <div class="row"><input id="vf" placeholder="Filtrar item" style="flex:1;min-width:160px"><select id="vs"><option value="todos">Todos</option><option value="falta">Falta contar</option><option value="dif">Com diferença</option></select>
      ${ab?'<button class="btn sec" id="vp">Imprimir folha</button><button class="btn" id="vc">Fechar inventário</button><button class="btn bad sm" id="vx">Cancelar</button>':''}</div>
    <div class="mut" id="vr" style="margin:8px 0"></div><div class="card" style="overflow-x:auto;max-height:60vh;overflow-y:auto" id="vt"></div>`);
  $('#vs').value=so;
  $('#mx').onclick=()=>{ modal(''); if(S.tab==='inv') tInvent(); };
  const resumo=()=>{ const c=v.itens.filter(i=>i.contado!==null), d=c.filter(i=>Math.abs(dif(i))>0.0001); $('#vr').textContent=`${c.length} de ${v.itens.length} itens contados · ${d.length} com diferença`; };
  const linha=it=>{ const d=dif(it); return `<td>${it.codigo}</td><td>${esc(it.nome)}</td><td class="n">${fmt(ab?it.saldo_atual:it.contado-it.ajuste,3)}</td>
    <td class="n">${ab?`<input type="number" min="0" step="any" inputmode="decimal" data-c="${it.item_id}" value="${it.contado??''}" style="width:90px;text-align:right">`:fmt(it.contado,3)}</td>
    <td class="n ${d===null?'':d<0?'bad':d>0?'ok':''}"><b>${d===null?'':(d>0?'+':'')+fmt(d,3)}</b></td>`; };
  const desenha=()=>{ const f=filtro.toLowerCase(); const l=v.itens.filter(i=>(!f||(i.nome+' '+i.codigo).toLowerCase().includes(f))&&(so==='todos'||(so==='falta'?i.contado===null:i.contado!==null&&Math.abs(dif(i))>0.0001)));
    $('#vt').innerHTML=`<table><tr><th>Código</th><th>Item</th><th class="n">${ab?'Sistema':'Antes'}</th><th class="n">Contado</th><th class="n">Diferença</th></tr>${l.map(it=>`<tr data-r="${it.item_id}">${linha(it)}</tr>`).join('')||'<tr><td colspan=5 class="vazio">Nada aqui.</td></tr>'}</table>`;
    $('#vt').querySelectorAll('[data-c]').forEach(inp=>{ inp.onchange=tenta(async()=>{ const it=v.itens.find(i=>i.item_id===+inp.dataset.c); const val=inp.value.trim()===''?null:parseFloat(inp.value.replace(',','.'));
      await api(`/api/inventarios/${v.id}/contagem`,{item_id:it.item_id,contado:val}); it.contado=val; const tr=inp.closest('tr'); tr.lastElementChild.outerHTML=linha(it).split('</td>').slice(-2)[0]+'</td>'; resumo(); });
      inp.onkeydown=e=>{ if(e.key==='Enter'){ const all=[...$('#vt').querySelectorAll('[data-c]')]; const n=all[all.indexOf(inp)+1]; inp.blur(); if(n) n.focus(); } }; });
    resumo(); };
  desenha();
  $('#vf').oninput=e=>{ filtro=e.target.value; desenha(); }; $('#vs').onchange=e=>{ so=e.target.value; desenha(); };
  if(!ab) return;
  $('#vp').onclick=()=>{ const w=window.open('','_blank'); if(!w) return toast('O navegador bloqueou a impressão',1);
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Inventário ${v.id}</title><style>@page{size:A4;margin:12mm}body{font-family:Helvetica,Arial,sans-serif;font-size:11px}h1{font-size:16px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid #999;padding:5px 6px;text-align:left}th{background:#eee}td.c{width:90px}</style></head><body>
      <h1>OMAMA · Inventário nº ${v.id} · ${esc(v.deposito)}</h1><div>Data: ____/____/______ &nbsp;&nbsp; Contado por: ______________________________</div>
      <table><tr><th>Código</th><th>Item</th><th>Contado</th></tr>${v.itens.map(i=>`<tr><td>${i.codigo}</td><td>${esc(i.nome)}</td><td class="c"></td></tr>`).join('')}</table><script>setTimeout(()=>print(),300)<\/script></body></html>`); w.document.close(); };
  $('#vx').onclick=tenta(async()=>{ if(!confirm('Cancelar o inventário nº '+v.id+'? Nada no estoque muda.')) return; await api(`/api/inventarios/${v.id}/cancelar`,{}); toast('Inventário cancelado'); modal(''); tInvent(); });
  $('#vc').onclick=()=>{ const c=v.itens.filter(i=>i.contado!==null), d=c.filter(i=>Math.abs(dif(i))>0.0001), falta=v.itens.length-c.length;
    modal(`<h2 style="margin-top:0">Fechar inventário nº ${v.id} · ${esc(v.deposito)}</h2>
      <p>${c.length} itens contados, <b>${d.length} com diferença</b>. O saldo desses itens vai ser corrigido para o que foi contado.</p>

// zip simples (sem compressão; foto já é comprimida)
function fazZip(arqs){ const T=new Uint32Array(256).map((_,n)=>{ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; return c>>>0; });
  const crc=d=>{ let c=0xFFFFFFFF; for(let i=0;i<d.length;i++) c=T[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc=new TextEncoder(), partes=[], central=[]; let off=0;
  const h=(n,campos)=>{ const b=new DataView(new ArrayBuffer(n)); let i=0; for(const [v,t] of campos){ if(t===4){b.setUint32(i,v,true);i+=4;} else {b.setUint16(i,v,true);i+=2;} } return new Uint8Array(b.buffer); };
  for(const [nome,dados] of arqs){ const nm=enc.encode(nome), c=crc(dados);
    const loc=h(30,[[0x04034b50,4],[20,2],[0x0800,2],[0,2],[0,2],[0,2],[c,4],[dados.length,4],[dados.length,4],[nm.length,2],[0,2]]);
    partes.push(loc,nm,dados);
    central.push(h(46,[[0x02014b50,4],[20,2],[20,2],[0x0800,2],[0,2],[0,2],[0,2],[c,4],[dados.length,4],[dados.length,4],[nm.length,2],[0,2],[0,2],[0,2],[0,2],[0,4],[off,4]]),nm);
    off+=30+nm.length+dados.length; }
  const tam=central.reduce((s,x)=>s+x.length,0);
  return new Blob([...partes,...central,h(22,[[0x06054b50,4],[0,2],[0,2],[arqs.length,2],[arqs.length,2],[tam,4],[off,4],[0,2]])],{type:'application/zip'}); }
const zipPedido=tenta(async p=>{

  const pasta=`${p.numero} - ${(p.cliente||'').replace(/[\\/:*?"<>|]/g,'')}`, cont={}, n={}, arqs=[];
  l.forEach(f=>cont[f.codigo]=(cont[f.codigo]||0)+1);
  for(const f of l){ n[f.codigo]=(n[f.codigo]||0)+1; arqs.push([`${pasta}/${f.codigo} - ${n[f.codigo]} de ${cont[f.codigo]}.jpg`,new Uint8Array(await (await fetch(fotoUrl(f.id))).arrayBuffer())]); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(fazZip(arqs)); a.download=pasta+'.zip'; a.click(); toast(l.length+' foto(s) no zip');
});

function periodo(){ const d=new Date(hojeISO()+'T12:00'), iso=x=>x.toISOString().slice(0,10);

  if(S.per==='semana'){ const s=new Date(d); s.setDate(d.getDate()-((d.getDay()+6)%7)); return [iso(s),iso(d)]; }

function unidades(it){
  const q=Math.round(it.qtd), out=[], put=(k,n)=>{ n=Math.max(0,Math.min(Math.round(n),q-out.length)); for(let i=0;i<n;i++) out.push(k); };
  put('enviada',it.enviada); put('embalada',it.embalada-it.enviada); put('conferida',it.conferida-it.embalada);
  put('pronta',(it.op_fin||0)-it.conferida); put('acabamento',it.op_acab||0); put('producao',it.op_prod||0);
  const v=(it.etapa_v8||'').toLowerCase(); put(v==='acabamento'?'acabamento':v==='produção'?'producao':'aguardando',q);
  return out;
}

  $('#dsv').onclick=tenta(async()=>{
    if(!item) throw new Error('Escolha a peça'); if(!motivo) throw new Error('Escolha o motivo');
    const qtd=+$('#dq').value; if(!(qtd>0)) throw new Error('Quantidade inválida');
    await api('/api/defeitos',{item_id:item.id,qtd,origem,op_codigo:$('#dop').value.trim()||null,motivo,setor_id:+$('#ds').value||null,funcionario_id:+$('#df').value||null,obs:$('#dob').value.trim()||null});
    toast('Defeito registrado'); modal(''); if(pre.depois) pre.depois(); else if(S.tab==='defeitos') tDefeitos();
  });
}

// ===== funcionários
async function tFuncionarios(){
  app.innerHTML=`<h2>Adicionar pessoa</h2><div class="row"><input id="nn" placeholder="Nome"><select id="ns">${B.setores.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select><button class="btn" id="na">Adicionar</button></div>
    <h2>Equipe</h2><div class="card" id="fl">Carregando…</div>`;
  $('#na').onclick=tenta(async()=>{ const n=$('#nn').value.trim(); if(!n) throw new Error('Escreva o nome'); await api('/api/funcionarios',{nome:n,setor_id:+$('#ns').value}); B=await api('/api/base'); toast(n+' adicionado'); tFuncionarios(); });
  const l=await api('/api/funcionarios');
  $('#fl').innerHTML=`<table><tr><th>Nome</th><th>Setor</th><th>Situação</th><th></th></tr>${l.map(f=>`<tr style="${f.ativo?'':'opacity:.5'}"><td><b>${esc(f.nome)}</b></td><td>${esc(f.setor||'—')}</td><td>${f.ativo?'<span class="tag t-produzindo">Ativo</span>':'<span class="tag t-pendente">Inativo</span>'}</td><td class="n"><button class="btn sec sm" data-f="${f.id}">Editar</button></td></tr>`).join('')}</table>`;
  $('#fl').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const f=l.find(x=>x.id===+b.dataset.f);
    modal(`<h2 style="margin-top:0">Editar ${esc(f.nome)}</h2><div class="row"><input id="en" value="${esc(f.nome)}"><select id="es"><option value="">Sem setor</option>${B.setores.map(s=>`<option value="${s.id}" ${s.id===f.setor_id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select>
      <label class="row" style="gap:4px"><input type="checkbox" id="ea" ${f.ativo?'checked':''}> Ativo</label></div><p class="mut">Inativo some das listas de quem faz operação e da assiduidade, mas o histórico fica guardado.</p>
      <div class="row"><button class="btn" id="eg">Salvar</button><button class="btn sec" id="ex">Voltar</button></div>`);
    $('#ex').onclick=()=>modal('');
    $('#eg').onclick=tenta(async()=>{ await api('/api/funcionarios/'+f.id,{nome:$('#en').value,setor_id:+$('#es').value||null,ativo:$('#ea').checked}); B=await api('/api/base'); toast('Salvo'); modal(''); tFuncionarios(); }); });
}

// ===== assiduidade (só lança faltas e atrasos; quem não tem lançamento estava presente)
const PRES={falta_injustificada:['Falta não justificada','bad'],falta_justificada:['Falta justificada','midc'],atestado:['Atestado','blue'],atraso:['Atraso / saída cedo','midc'],folga:['Folga / férias','mut']};
const TAGC={bad:'background:#fbe3e1;color:#b2362d',midc:'background:#fbefd3;color:#94690d',blue:'background:#e1eefb;color:#2d6aa3',mut:'background:#f0edf7;color:var(--mut)'};
function semanaDe(iso){ const d=new Date(iso+'T12:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); const f=new Date(d); f.setDate(d.getDate()+6); const x=v=>v.toISOString().slice(0,10); return [x(d),x(f)]; }
async function tAssid(){
  const [de,ate]=semanaDe(S.dia||hojeISO());
  const mv=n=>{ const d=new Date(de+'T12:00'); d.setDate(d.getDate()+7*n); S.dia=d.toISOString().slice(0,10); tAssid(); };
  let tipo='falta_injustificada';
  const opt=fs=>fs.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('');
  app.innerHTML=`<h2>Lançar falta ou atraso</h2><div class="card">
    <div class="row"><select id="lp"><option value="">Quem?</option>${B.setores.map(s=>`<optgroup label="${esc(s.nome)}">${opt(B.funcionarios.filter(f=>f.setor_id===s.id))}</optgroup>`).join('')}${opt(B.funcionarios.filter(f=>!f.setor_id))}</select>
      <input type="date" id="ld" value="${hojeISO()}"></div>
    <div class="row" id="lt" style="margin-top:10px">${Object.entries(PRES).map(([k,[n,c]])=>`<button class="st ${c} ${k===tipo?'on':''}" data-s="${k}">${n}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><input id="lmin" type="number" min="1" inputmode="numeric" placeholder="Minutos" style="width:110px;display:none"><input id="lo" placeholder="Motivo / observação" style="flex:1;min-width:200px"><button class="btn" id="lg">Lançar</button></div></div>
    <div class="row" style="justify-content:space-between;margin-top:18px"><h2 style="margin:0">Semana ${brData(de)} a ${brData(ate)}</h2>
      <div class="row"><button class="btn sec sm" id="ap">◀</button><button class="btn sec sm" id="ah">Esta semana</button><button class="btn sec sm" id="an">▶</button></div></div>
    <div id="al" class="vazio">Carregando…</div>`;
  $('#ap').onclick=()=>mv(-1); $('#an').onclick=()=>mv(1); $('#ah').onclick=()=>{ S.dia=null; tAssid(); };
  $('#lt').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ tipo=b.dataset.s; $('#lt').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b)); $('#lmin').style.display=tipo==='atraso'?'':'none'; });
  $('#lg').onclick=tenta(async()=>{
    const fid=+$('#lp').value, dia=$('#ld').value; if(!fid) throw new Error('Escolha a pessoa'); if(!dia) throw new Error('Escolha o dia');
    const minutos=tipo==='atraso'?+$('#lmin').value:null; if(tipo==='atraso'&&!(minutos>0)) throw new Error('Informe os minutos');
    const obs=$('#lo').value.trim(); if(tipo==='falta_justificada'&&!obs) throw new Error('Escreva o motivo da falta');
    await api('/api/presenca',{data:dia,funcionario_id:fid,status:tipo,minutos,obs:obs||null});
    toast(B.funcionarios.find(f=>f.id===fid).nome+': '+PRES[tipo][0]+' lançado'); S.dia=dia; tAssid();
  });
  const l=await api(`/api/presenca?de=${de}&ate=${ate}`);
  const res={}; l.forEach(r=>{ const p=res[r.funcionario_id]=res[r.funcionario_id]||{nome:r.nome,setor:r.setor,min:0}; p[r.status]=(p[r.status]||0)+1; if(r.status==='atraso') p.min+=r.minutos||0; });
  $('#al').className='';
  $('#al').innerHTML=l.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Dia</th><th>Pessoa</th><th>O quê</th><th>Detalhe</th><th></th></tr>
    ${l.map(r=>{ const [n,c]=PRES[r.status]||[r.status,'mut']; return `<tr><td>${new Date(r.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td><b>${esc(r.nome)}</b> <span class="mut">${esc(r.setor||'')}</span></td>
      <td><span class="tag" style="${TAGC[c]}">${n}</span></td><td class="mut">${r.minutos?r.minutos+' min':''}${r.minutos&&r.obs?' · ':''}${esc(r.obs||'')}</td><td class="n"><button class="btn sec sm" data-x="${r.id}">Apagar</button></td></tr>`}).join('')}</table></div>
    <h2>Resumo da semana</h2><div class="card" style="overflow-x:auto"><table><tr><th>Pessoa</th><th class="n">Falta não just.</th><th class="n">Falta just.</th><th class="n">Atestado</th><th class="n">Atrasos / saídas</th><th class="n">Folga / férias</th></tr>
    ${Object.values(res).sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<tr><td>${esc(p.nome)}</td><td class="n ${p.falta_injustificada?'bad':''}"><b>${p.falta_injustificada||''}</b></td><td class="n">${p.falta_justificada||''}</td><td class="n">${p.atestado||''}</td><td class="n">${p.atraso?p.atraso+' ('+dur(p.min)+')':''}</td><td class="n">${p.folga||''}</td></tr>`).join('')}</table>
    <p class="mut">Quem não aparece aqui não teve falta nem atraso na semana. Folga e férias não contam como falta.</p></div>`
    :'<div class="card vazio">Nenhuma falta ou atraso lançado nesta semana.</div>';
  $('#al').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ const r=l.find(x=>x.id===+b.dataset.x);
    modal(`<h2 style="margin-top:0">Apagar lançamento?</h2><p>${esc(r.nome)} · ${(PRES[r.status]||[r.status])[0]} · ${brData(r.data)}</p><div class="row"><button class="btn bad" id="xc">Apagar</button><button class="btn sec" id="xv">Voltar</button></div>`);
    $('#xv').onclick=()=>modal('');
    $('#xc').onclick=tenta(async()=>{ await api('/api/presenca',{data:r.data,funcionario_id:r.funcionario_id,status:'presente'}); modal(''); toast('Apagado'); tAssid(); }); });
}
iniciar();
</script>
</body>
</html>
